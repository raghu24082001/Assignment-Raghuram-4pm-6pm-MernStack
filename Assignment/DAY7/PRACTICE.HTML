<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <div id="show1"></div>
     <div id="show2"></div>
     <script>
    const dataNew = async ()=>{
    try{

        const data1 =  await fetch('https://official-joke-api.appspot.com/jokes/programming/random')
        
        const data2 =  await data1.json()

        console.log(data2[0].setup)

        console.log(data2[0].punchline)

        
document.getElementById('show1').innerHTML= data2[0].setup

document.getElementById('show2').innerHTML= data2[0].punchline

    }catch(error){
       console.log(error.message)
    }
}

dataNew()

</script>
</body>
</html>
